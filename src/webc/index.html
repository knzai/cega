<!doctype html>
<html lang="en">
<head>
   <link data-trunk rel="css" href="./styles.css" />
   <link 
   data-trunk 
   rel="rust" href="../../Cargo.toml"
   data-bin="cega-webc" 
   data-cargo-no-default-features 
   data-cargo-features="webc"
   />
   <script>
      const fileReader = new FileReader();
      fileReader.onloadend = function() {
         let array = new Int8Array(fileReader.result);
         let images = window.wasmBindings.previews(array);
         images.forEach(makePreview);
      }
      document.addEventListener("DOMContentLoaded", () => {
         const fileInput = document.getElementById('file-input');
         fileInput.addEventListener("change", e => fileReader.readAsArrayBuffer(fileInput.files[0]));
      });

      class PreviewItem extends HTMLElement {
         constructor() {
            super();
            const content = document.querySelector("#preview-item").content;
            const clone = document.importNode(content, true);
            const shadow = this.attachShadow({mode: "open"});
            const h3 = clone.querySelector('h3');
            
            this.img = clone.querySelector("img");
            this.img.onload = function () {
               h3.innerText = this.width;
            }
            shadow.appendChild(clone);
         }
         set image_src(src) {
            this.img.src = src;
         }
         get image_src() {
            this.img.src;
         }
      }
      customElements.define("preview-item", PreviewItem);

      function makePreview(src) {
         const container = document.getElementById("preview-area");
         let preview = new PreviewItem()
         preview.image_src = src
         container.appendChild(preview);
      }
   </script>
</head>
<body>
   <h1>Process your CGA/EGAs</h1>
   <input id="file-input" multiple="false" type="file" accept=".bin,.cga,.ega,.cega" />
   <div id="preview-area"></div>
   <template id="preview-item">
      <h3></h3><img/>
   </template>
</body>
</html>
